#Rôle : expose les pods portant le label app: demo-app derrière une adresse stable. 
apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  type: ClusterIP  #ClusterIP = accessible uniquement depuis l'intérieur du cluster.
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 80